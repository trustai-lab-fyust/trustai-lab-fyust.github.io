# 研究方向，按首页显示顺序。lead 填 people.yaml 里教师的 id；highlights 填 publications.yaml 里的论文 id；
# image 是 assets/img/research/ 下的配图文件名。
- id: trustworthy-llm
  title_zh: 大模型安全与可信
  title_en: LLM Safety and Trustworthiness
  lead: bao
  image: trustworthy-llm.jpg
  keywords_zh: [AIGC 检测与溯源, 机器生成文本检测, 大模型可靠推理, 安全可信智能体]
  keywords_en: [AIGC detection and attribution, Machine-generated text detection, Reliable LLM reasoning, Safe and trustworthy agents]
  summary_zh: >-
    研究大模型生成内容的检测与溯源、模型推理过程的可靠性与可解释性，以及智能体的安全边界，
    让大模型的输出可检验、推理可信赖、行为可约束。代表工作 Fast-DetectGPT（ICLR 2024）实现零样本机器生成文本检测，
    获《麻省理工科技评论》报道并商业化落地。
  summary_en: >-
    We work on detecting and attributing LLM-generated content, on the reliability and interpretability of
    LLM reasoning, and on safety boundaries for agents, so that model outputs can be verified, reasoning can be
    trusted and behaviour can be constrained. Fast-DetectGPT (ICLR 2024), our zero-shot detector for
    machine-generated text, was covered by MIT Technology Review and is deployed commercially.
  highlights: [iclr2025, iclr2024, tacl2026, emnlp2025, coling2025]

- id: llm-agent-vertical
  title_zh: 大模型与智能体及垂直领域应用
  title_en: LLM Agents and Vertical-Domain Applications
  lead: hou
  image: llm-agent-vertical.jpg
  keywords_zh: [大模型与智能体, 知识图谱与图神经网络, 可信约束推理, 医疗与工程应用]
  keywords_en: [LLMs and agents, Knowledge graphs and graph neural networks, Trustworthy reasoning, Healthcare and engineering applications]
  summary_zh: >-
    研究大模型与智能体及在医疗、工程等垂直领域中的可靠约束推理、知识引导与可解释，
    以及图学习与知识图谱方法，推动可信 AI 在真实业务中落地。主持国家、省市及横向科研项目多项，
    成果发表于 TPAMI、TNNLS、TKDE、AAAI、IJCAI。
  summary_en: >-
    We study reliable, constrained and explainable reasoning of LLMs and agents in vertical domains such as
    healthcare and engineering, together with graph learning and knowledge-graph methods, to bring
    trustworthy AI into real workflows. The lead is PI of an NSFC Young Scientists project and several other projects; 
    results appear in TPAMI, TNNLS, TKDE, AAAI and IJCAI.
  highlights: [tpami2026, tr2026, kbs2025a, tnnls2024, tkde2022]

- id: sys-net-sec
  title_zh: 系统与网络安全
  title_en: System and Network Security
  lead: wang
  image: sys-net-sec.jpg
  keywords_zh: [协议分析与漏洞挖掘, 流量分析与威胁检测, 大规模网络测量与治理, 大模型辅助安全分析]
  keywords_en: [Protocol analysis and vulnerability discovery, Traffic analysis and threat detection, Large-scale network measurement and governance, LLM-assisted security analysis]
  summary_zh: >-
    研究网络协议与软件系统中的安全缺陷及其防御：协议分析与漏洞挖掘、流量分析与威胁检测、
    大规模网络测量与治理，以及用大模型辅助漏洞发现与安全分析。多个漏洞已收录 CVE，
    成果发表于 IEEE S&P、INFOCOM、WWW。
  summary_en: >-
    We study security flaws in network protocols and software systems and how to defend against them:
    protocol analysis and vulnerability discovery, traffic analysis and threat detection, large-scale network
    measurement and governance, and LLM-assisted vulnerability discovery and security analysis. Several
    findings have been assigned CVEs; results appear at IEEE S&P, INFOCOM and WWW.
  highlights: [sp2026, infocom2026, www2025, infocom2023, infocom2022]
