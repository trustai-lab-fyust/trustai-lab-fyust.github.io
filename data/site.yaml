# 首屏一句话：三个分句分别对应三个研究方向
tagline_zh: 让大模型的输出可检验、智能体的行为可约束、系统与网络的风险可防御
tagline_en: Verifiable model outputs, constrained agent behaviour, defensible systems and networks

# 首页曾用的一段简介，现在首页不显示；想恢复的话在 templates/index.html 里加回 site.intro
intro_zh: >-
  安全可信智能联合实验室由福耀科技大学计算与人工智能学院三位教师联合组建，聚焦大模型时代的安全与可信，
  围绕大模型安全与可信、大模型智能体与垂直领域应用、系统与网络安全三个方向开展研究：既研究大模型自身的检测、
  推理可靠性与智能体安全，也研究系统与网络层面的攻击与防御，并把方法落到医疗、工程和公共安全等真实场景。
intro_en: >-
  TrustAI Lab is a joint laboratory founded by three faculty members of the School of Computing and
  Artificial Intelligence at Fuyao University of Science and Technology. We focus on security and trust in
  the era of large models, along three lines: LLM safety and trustworthiness, LLM agents and vertical-domain
  applications, and system and network security. We study detection, reliable reasoning and agent safety for
  the models themselves, as well as attacks and defenses at the system and network level, and bring the
  methods into healthcare, engineering and public-safety settings.

